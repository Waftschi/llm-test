<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🍺 Barkeeper Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 900px;
        }
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 16px 16px 0 0;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { font-size: 12px; opacity: 0.9; }
        .state-bar {
            background: #f8f9fa;
            padding: 12px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .state-item { display: flex; gap: 8px; }
        .state-item strong { color: #667eea; }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row-reverse; justify-content: flex-end; }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-line;
        }
        .message.user .message-content { background: #667eea; color: white; border-radius: 12px 2px 12px 12px; }
        .message.bot .message-content { background: #f0f0f0; color: #333; border-radius: 2px 12px 12px 12px; }
        .log { margin-top: 8px; font-size: 12px; white-space: normal; }
        .log summary { cursor: pointer; color: #667eea; font-weight: 600; }
        .log-h { margin: 8px 0 4px; font-weight: 700; color: #555; }
        .log-warn { color: #b26a00; margin-top: 4px; }
        .concept { margin: 4px 0; }
        .concept .sub { color: #666; margin-left: 8px; }
        .bar { display: inline-block; height: 8px; border-radius: 4px; margin: 0 6px; vertical-align: middle; }
        .bar.pos { background: #667eea; }
        .bar.neg { background: #dc3545; }
        .input-area {
            border-top: 1px solid #e0e0e0;
            padding: 16px 20px;
            background: white;
            border-radius: 0 0 16px 16px;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus { border-color: #667eea; }
        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
        }
        .input-area button:hover { background: #764ba2; }
        .reset-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .reset-btn:hover { background: #e0e0e0; }
        .info-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 12px;
            border-radius: 6px;
            margin: 10px 20px;
            font-size: 12px;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f0f0f0;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍺 Barkeeper</h1>
            <p>Two-layer neural network · German conversation</p>
        </div>

        <div class="state-bar">
            <div class="state-item"><strong>Context:</strong> <span id="context">start</span></div>
            <div class="state-item"><strong>Bill:</strong> <span id="bill">€0.00</span></div>
            <button class="reset-btn" onclick="resetChat()">New Guest</button>
        </div>

        <div class="info-box" id="infoBox" style="display:none;">
            ⏳ Waiting for server on http://localhost:8765
        </div>

        <div class="chat-area" id="chatArea"></div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="ein bier | falsch | noch eins = bier | [wein] noch eins = wein" onkeypress="handleKeyPress(event)" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById("chatArea");
        const messageInput = document.getElementById("messageInput");
        const contextSpan = document.getElementById("context");
        const billSpan = document.getElementById("bill");
        const infoBox = document.getElementById("infoBox");
        const SERVER_URL = "";
        let isLoading = false;
        let serverReady = false;

        // Check server availability
        async function checkServer() {
            try {
                const response = await fetch(SERVER_URL + "/health");
                if (response.ok) {
                    serverReady = true;
                    infoBox.style.display = "none";
                    console.log("✅ Server ready!");
                }
            } catch (e) {
                serverReady = false;
                infoBox.style.display = "block";
                setTimeout(checkServer, 2000);
            }
        }
        checkServer();

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isLoading) return;
            if (!serverReady) {
                alert("Server is not ready yet. Please wait...");
                return;
            }

            isLoading = true;
            messageInput.value = "";
            messageInput.disabled = true;
            addMessage(message, "user");

            const loadingMsg = document.createElement("div");
            loadingMsg.className = "message bot";
            loadingMsg.innerHTML = '<div class="message-content"><div class="loading"></div></div>';
            chatArea.appendChild(loadingMsg);
            chatArea.scrollTop = chatArea.scrollHeight;

            try {
                const response = await fetch(SERVER_URL + "/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                loadingMsg.remove();
                const botContent = addMessage(data.response, "bot");
                if (data.log) botContent.appendChild(renderLog(data.log));
                contextSpan.textContent = data.context;
                billSpan.textContent = "€" + data.bill.toFixed(2);
            } catch (error) {
                loadingMsg.remove();
                addMessage("Error: " + error.message, "bot");
                serverReady = false;
                checkServer();
            } finally {
                isLoading = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.className = "message " + sender;
            const content = document.createElement("div");
            content.className = "message-content";
            if (sender === "bot") {
                content.innerHTML = '🍺 ';
            }
            const textSpan = document.createElement("span");
            textSpan.textContent = text;
            content.appendChild(textSpan);
            msgDiv.appendChild(content);
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            return content;
        }

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function renderLog(log) {
            const d = el("details", "log");
            d.appendChild(el("summary", "", "🧠 Wie hat der Barkeeper entschieden?"));
            if (log.unknown.length)
                d.appendChild(el("div", "log-warn", "Unbekannte Wörter (ignoriert): " + log.unknown.join(", ")));
            d.appendChild(el("div", "log-h", "Schicht 1: Wörter → Konzepte"));
            log.concepts.forEach(c => {
                const row = el("div", "concept");
                row.appendChild(el("b", "", "Konzept " + c.id));
                const bar = el("span", "bar " + (c.activation >= 0 ? "pos" : "neg"));
                bar.style.width = Math.round(Math.abs(c.activation) * 60) + "px";
                row.appendChild(bar);
                row.appendChild(el("span", "", (c.activation >= 0 ? "+" : "") + c.activation.toFixed(2)));
                row.appendChild(el("div", "sub", "getrieben von: " +
                    c.drivers.map(x => x.word + " (" + (x.weight >= 0 ? "+" : "") + x.weight.toFixed(1) + ")").join("  ")));
                const g = v => (v >= 0 ? "+" : "") + v.toFixed(2);
                row.appendChild(el("div", "sub", "Σ Wörter " + g(c.word_sum) + "  + Bias " + g(c.bias) +
                    "  = " + g(c.z) + "  →  tanh(" + g(c.z) + ") = " + g(c.activation)));
                row.appendChild(el("div", "sub", "Stimmen: " +
                    c.votes.map((v, i) => log.top[i].intent + " " + (v >= 0 ? "+" : "") + v.toFixed(1)).join("  /  ")));
                d.appendChild(row);
            });
            d.appendChild(el("div", "log-h", "Schicht 2: Konzepte → Antwort"));
            log.top.forEach(t => {
                const row = el("div", "concept");
                row.appendChild(el("b", "", t.intent));
                const bar = el("span", "bar pos");
                bar.style.width = Math.round(t.prob * 100) + "px";
                row.appendChild(bar);
                row.appendChild(el("span", "", Math.round(t.prob * 100) + "%"));
                const f = v => (v >= 0 ? "+" : "") + v.toFixed(1);
                row.appendChild(el("div", "sub", "Summe: gezeigte Konzepte " + f(t.shown) +
                    "  + übrige " + f(t.others) + "  + Bias " + f(t.bias) + "  = Punktzahl " + f(t.score)));
                d.appendChild(row);
            });
            const s = log.softmax;
            d.appendChild(el("div", "log-h", "Softmax: e^(Punktzahl − beste Punktzahl), dann Anteil an der Summe"));
            s.rows.forEach(r => {
                const row = el("div", "concept");
                row.appendChild(el("b", "", r.intent));
                row.appendChild(el("div", "sub", r.score.toFixed(1) + " − " + s.best.toFixed(1) + " = " +
                    (r.score - s.best).toFixed(1) + "  →  e^ = " + r.exp.toFixed(4) +
                    "  →  " + r.exp.toFixed(4) + " / " + s.total.toFixed(4) + " = " +
                    (100 * r.exp / s.total).toFixed(1) + " %"));
                d.appendChild(row);
            });
            d.appendChild(el("div", "sub", "übrige " + s.rest_n + " Antworten: e^ = " + s.rest.toFixed(4) +
                "   |   Summe gesamt: " + s.total.toFixed(4)));
            return d;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") sendMessage();
        }

        async function resetChat() {
            if (!confirm("Start a new conversation?")) return;
            try {
                await fetch(SERVER_URL + "/reset", { method: "POST" });
            } catch (e) {}
            chatArea.innerHTML = "";
            contextSpan.textContent = "start";
            billSpan.textContent = "€0.00";
            addMessage("Servus! Was darf's sein?", "bot");
            messageInput.focus();
        }

        window.addEventListener("load", () => {
            addMessage("Servus! Was darf's sein?", "bot");
            messageInput.focus();
        });
    </script>
</body>
</html>
